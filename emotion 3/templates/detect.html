<!DOCTYPE html>
<html>
<head>
    <title>Detect Emotion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Detect Your Emotion 💫</h1>

<form method="POST">
    <textarea name="text" placeholder="Type your feelings here..."></textarea>
    <br>
    <button type="submit">Detect Emotion</button>
</form>

{% if detected %}
<div class="result-card">
    <h2>{{ detected }}</h2>
    <div class="emoji">{{ emoji }}</div>
</div>
{% endif %}

</body>
</html>
